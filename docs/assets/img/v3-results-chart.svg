<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="barV1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    
    <linearGradient id="barV2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="barV3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <linearGradient id="barHybrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Jev-RAG Benchmark Results</text>
  <text x="600" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Comparing pipeline versions across key metrics</text>
  
  <!-- Chart Area -->
  <g transform="translate(120, 130)">
    <!-- Chart Background -->
    <rect x="0" y="0" width="960" height="420" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow)"/>
    
    <!-- Grid Lines -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="0" y1="84" x2="960" y2="84"/>
      <line x1="0" y1="168" x2="960" y2="168"/>
      <line x1="0" y1="252" x2="960" y2="252"/>
      <line x1="0" y1="336" x2="960" y2="336"/>
    </g>
    
    <!-- Y-axis Labels -->
    <g text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
      <text x="-10" y="88">100%</text>
      <text x="-10" y="172">75%</text>
      <text x="-10" y="256">50%</text>
      <text x="-10" y="340">25%</text>
      <text x="-10" y="415">0%</text>
    </g>
    
    <!-- Y-axis Title -->
    <text x="-60" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" transform="rotate(-90 -60 210)">Score</text>
    
    <!-- Metric Groups -->
    <!-- Group 1: Answer Relevance -->
    <g transform="translate(80, 0)">
      <text x="75" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Answer</text>
      <text x="75" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Relevance</text>
      
      <!-- V1 Bar -->
      <rect x="0" y="126" width="30" height="294" fill="url(#barV1)" rx="4" filter="url(#shadow)"/>
      <text x="15" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">0.72</text>
      
      <!-- V2 Bar -->
      <rect x="40" y="105" width="30" height="315" fill="url(#barV2)" rx="4" filter="url(#shadow)"/>
      <text x="55" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">0.78</text>
      
      <!-- V3 Bar -->
      <rect x="80" y="67" width="30" height="353" fill="url(#barV3)" rx="4" filter="url(#shadow)"/>
      <text x="95" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.88</text>
      
      <!-- Hybrid Bar -->
      <rect x="120" y="46" width="30" height="374" fill="url(#barHybrid)" rx="4" filter="url(#glow)"/>
      <text x="135" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">0.92</text>
    </g>
    
    <!-- Group 2: Context Precision -->
    <g transform="translate(280, 0)">
      <text x="75" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Context</text>
      <text x="75" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Precision</text>
      
      <!-- V1 Bar -->
      <rect x="0" y="168" width="30" height="252" fill="url(#barV1)" rx="4" filter="url(#shadow)"/>
      <text x="15" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">0.65</text>
      
      <!-- V2 Bar -->
      <rect x="40" y="147" width="30" height="273" fill="url(#barV2)" rx="4" filter="url(#shadow)"/>
      <text x="55" y="137" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">0.71</text>
      
      <!-- V3 Bar -->
      <rect x="80" y="84" width="30" height="336" fill="url(#barV3)" rx="4" filter="url(#shadow)"/>
      <text x="95" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.85</text>
      
      <!-- Hybrid Bar -->
      <rect x="120" y="63" width="30" height="357" fill="url(#barHybrid)" rx="4" filter="url(#glow)"/>
      <text x="135" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">0.89</text>
    </g>
    
    <!-- Group 3: Groundedness -->
    <g transform="translate(480, 0)">
      <text x="75" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Groundedness</text>
      <text x="75" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">(Faithfulness)</text>
      
      <!-- V1 Bar -->
      <rect x="0" y="189" width="30" height="231" fill="url(#barV1)" rx="4" filter="url(#shadow)"/>
      <text x="15" y="179" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">0.58</text>
      
      <!-- V2 Bar -->
      <rect x="40" y="147" width="30" height="273" fill="url(#barV2)" rx="4" filter="url(#shadow)"/>
      <text x="55" y="137" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">0.71</text>
      
      <!-- V3 Bar -->
      <rect x="80" y="63" width="30" height="357" fill="url(#barV3)" rx="4" filter="url(#shadow)"/>
      <text x="95" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.91</text>
      
      <!-- Hybrid Bar -->
      <rect x="120" y="42" width="30" height="378" fill="url(#barHybrid)" rx="4" filter="url(#glow)"/>
      <text x="135" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">0.94</text>
    </g>
    
    <!-- Group 4: Citation Accuracy -->
    <g transform="translate(680, 0)">
      <text x="75" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Citation</text>
      <text x="75" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Accuracy</text>
      
      <!-- V1 Bar -->
      <rect x="0" y="210" width="30" height="210" fill="url(#barV1)" rx="4" filter="url(#shadow)"/>
      <text x="15" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">0.52</text>
      
      <!-- V2 Bar -->
      <rect x="40" y="168" width="30" height="252" fill="url(#barV2)" rx="4" filter="url(#shadow)"/>
      <text x="55" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">0.65</text>
      
      <!-- V3 Bar -->
      <rect x="80" y="84" width="30" height="336" fill="url(#barV3)" rx="4" filter="url(#shadow)"/>
      <text x="95" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.86</text>
      
      <!-- Hybrid Bar -->
      <rect x="120" y="63" width="30" height="357" fill="url(#barHybrid)" rx="4" filter="url(#glow)"/>
      <text x="135" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">0.90</text>
    </g>
    
    <!-- Group 5: Latency (inverted scale) -->
    <g transform="translate(880, 0)">
      <text x="75" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Latency</text>
      <text x="75" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">(ms, lower=better)</text>
      
      <!-- V1 Bar -->
      <rect x="0" y="105" width="30" height="315" fill="url(#barV1)" rx="4" filter="url(#shadow)"/>
      <text x="15" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">850</text>
      
      <!-- V2 Bar -->
      <rect x="40" y="147" width="30" height="273" fill="url(#barV2)" rx="4" filter="url(#shadow)"/>
      <text x="55" y="137" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">720</text>
      
      <!-- V3 Bar -->
      <rect x="80" y="189" width="30" height="231" fill="url(#barV3)" rx="4" filter="url(#shadow)"/>
      <text x="95" y="179" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">600</text>
      
      <!-- Hybrid Bar -->
      <rect x="120" y="210" width="30" height="210" fill="url(#barHybrid)" rx="4" filter="url(#glow)"/>
      <text x="135" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">550</text>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(120, 620)">
    <rect width="960" height="60" fill="#0f172a" stroke="#334155" stroke-width="1" rx="8"/>
    
    <!-- V1 -->
    <rect x="20" y="18" width="24" height="24" fill="url(#barV1)" rx="4"/>
    <text x="52" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">v1 (Baseline)</text>
    
    <!-- V2 -->
    <rect x="200" y="18" width="24" height="24" fill="url(#barV2)" rx="4"/>
    <text x="232" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">v2 (7-slot Pipeline)</text>
    
    <!-- V3 -->
    <rect x="420" y="18" width="24" height="24" fill="url(#barV3)" rx="4"/>
    <text x="452" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">v3 (Escalation Gate)</text>
    
    <!-- Hybrid -->
    <rect x="680" y="18" width="24" height="24" fill="url(#barHybrid)" rx="4"/>
    <text x="712" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">Hybrid (Current)</text>
    
    <!-- Best badge -->
    <rect x="850" y="15" width="90" height="30" fill="#8b5cf6" rx="15" filter="url(#glow)"/>
    <text x="895" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fff"><Æ Best</text>
  </g>
</svg>