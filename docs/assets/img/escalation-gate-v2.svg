<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="sufficientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <linearGradient id="insufficientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Arrow markers -->
    <marker id="arrowDefault" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#64748b"/>
    </marker>
    
    <marker id="arrowYes" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#10b981"/>
    </marker>
    
    <marker id="arrowNo" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f59e0b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">Jev-RAG Escalation Gate</text>
  <text x="600" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">Context Sufficiency Decision Flow</text>
  
  <!-- Input: Reranked Passages -->
  <g transform="translate(100, 130)">
    <rect width="280" height="120" fill="url(#inputGrad)" rx="12" filter="url(#shadow)"/>
    <text x="140" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#fff">=Ñ Reranked Passages</text>
    <text x="140" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#dbeafe">After jev-score reranking</text>
    
    <!-- Passage examples -->
    <rect x="20" y="75" width="240" height="18" fill="#1d4ed8" rx="4"/>
    <text x="140" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#bfdbfe">Passage A (score: 0.94)</text>
    
    <rect x="20" y="98" width="240" height="18" fill="#1d4ed8" rx="4"/>
    <text x="140" y="111" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#bfdbfe">Passage B (score: 0.87)</text>
  </g>
  
  <!-- Arrow to Score -->
  <line x1="240" y1="250" x2="240" y2="290" stroke="#64748b" stroke-width="3" marker-end="url(#arrowDefault)"/>
  
  <!-- Score Feature Extraction -->
  <g transform="translate(100, 310)">
    <rect width="280" height="100" fill="url(#scoreGrad)" rx="12" filter="url(#shadow)"/>
    <text x="140" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#fff">=" Score Features</text>
    <text x="140" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e9d5ff">Extract calibrated features:</text>
    <text x="140" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">" top_score, score_gap, coverage</text>
    <text x="140" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">" query_passage_alignment</text>
  </g>
  
  <!-- Arrow to Decision -->
  <line x1="380" y1="360" x2="440" y2="360" stroke="#64748b" stroke-width="3" marker-end="url(#arrowDefault)"/>
  
  <!-- Decision Diamond -->
  <g transform="translate(450, 260)">
    <polygon points="150,0 300,100 150,200 0,100" fill="#1e293b" stroke="#f59e0b" stroke-width="4" filter="url(#shadow)"/>
    <text x="150" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">CONTEXT</text>
    <text x="150" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">SUFFICIENT?</text>
    <text x="150" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fcd34d">score e threshold</text>
  </g>
  
  <!-- YES Path -->
  <g transform="translate(800, 180)">
    <!-- YES Label -->
    <rect x="-40" y="-30" width="80" height="28" fill="#10b981" rx="14" filter="url(#shadow)"/>
    <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff">YES </text>
    
    <!-- Arrow from diamond -->
    <line x1="-100" y1="100" x2="-20" y2="20" stroke="#10b981" stroke-width="3" marker-end="url(#arrowYes)"/>
    
    <!-- Sufficient Context Box -->
    <rect y="20" width="260" height="100" fill="url(#sufficientGrad)" rx="12" filter="url(#shadow)"/>
    <text x="130" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#fff"> Context Sufficient</text>
    <text x="130" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#d1fae5">High confidence passages</text>
    <text x="130" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a7f3d0">Route to qwen3.7-plus</text>
  </g>
  
  <!-- NO Path -->
  <g transform="translate(800, 420)">
    <!-- NO Label -->
    <rect x="-35" y="-30" width="70" height="28" fill="#f59e0b" rx="14" filter="url(#shadow)"/>
    <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff">NO </text>
    
    <!-- Arrow from diamond -->
    <line x1="-100" y1="-60" x2="-20" y2="20" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowNo)"/>
    
    <!-- Insufficient Context Box -->
    <rect y="20" width="260" height="120" fill="url(#insufficientGrad)" rx="12" filter="url(#shadow)"/>
    <text x="130" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#fff">  Context Insufficient</text>
    <text x="130" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#fef3c7">Low confidence or gaps detected</text>
    <text x="130" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fde68a">Route to qwen3.6-plus</text>
    <text x="130" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fcd34d">(reasoning model)</text>
  </g>
  
  <!-- Model Selection -->
  <g transform="translate(800, 600)">
    <!-- Merge arrows -->
    <line x1="-500" y1="-380" x2="-200" y2="-100" stroke="#10b981" stroke-width="3" stroke-dasharray="5,5"/>
    <line x1="-500" y1="-140" x2="-200" y2="-80" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Model Router -->
    <rect width="260" height="130" fill="url(#modelGrad)" rx="12" filter="url(#shadow)"/>
    <text x="130" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#fff"><¯ Model Router</text>
    
    <rect x="20" y="55" width="105" height="60" fill="#0891b2" rx="8"/>
    <text x="72" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fff">qwen3.7-plus</text>
    <text x="72" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5f3fc">Fast &amp; Cheap</text>
    
    <rect x="135" y="55" width="105" height="60" fill="#0e7490" rx="8"/>
    <text x="187" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fff">qwen3.6-plus</text>
    <text x="187" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5f3fc">Deep Reasoning</text>
  </g>
  
  <!-- Final Output -->
  <g transform="translate(450, 630)">
    <rect width="280" height="130" fill="url(#outputGrad)" rx="12" filter="url(#shadow)"/>
    <text x="140" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#fff"> Final Answer</text>
    <text x="140" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#dcfce7">Cited response with</text>
    <text x="140" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#dcfce7">groundedness verification</text>
    
    <!-- Badge -->
    <rect x="90" y="100" width="100" height="22" fill="#15803d" rx="11"/>
    <text x="140" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#fff">=á Verified</text>
  </g>
  
  <!-- Arrow to Output -->
  <line x1="800" y1="665" x2="730" y2="665" stroke="#64748b" stroke-width="3" marker-end="url(#arrowDefault)"/>
  
  <!-- Threshold Info Box -->
  <g transform="translate(100, 600)">
    <rect width="280" height="160" fill="#1e293b" stroke="#475569" stroke-width="2" rx="10"/>
    <text x="140" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">=Ê Gate Thresholds</text>
    
    <rect x="20" y="45" width="240" height="28" fill="#0f172a" rx="4"/>
    <text x="140" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">score_threshold = 0.75</text>
    
    <rect x="20" y="80" width="240" height="28" fill="#0f172a" rx="4"/>
    <text x="140" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">gap_threshold = 0.15</text>
    
    <rect x="20" y="115" width="240" height="28" fill="#0f172a" rx="4"/>
    <text x="140" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">coverage_min = 0.60</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(600, 740)">
    <rect x="-250" y="-15" width="500" height="50" fill="#0f172a" stroke="#334155" rx="8"/>
    <text x="-230" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Legend:</text>
    
    <rect x="-160" y="-5" width="20" height="20" fill="#3b82f6" rx="4"/>
    <text x="-135" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Input</text>
    
    <rect x="-70" y="-5" width="20" height="20" fill="#8b5cf6" rx="4"/>
    <text x="-45" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Processing</text>
    
    <rect x="40" y="-5" width="20" height="20" fill="#10b981" rx="4"/>
    <text x="65" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Success</text>
    
    <rect x="140" y="-5" width="20" height="20" fill="#f59e0b" rx="4"/>
    <text x="165" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Escalation</text>
  </g>
</svg>