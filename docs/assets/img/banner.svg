<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Jev-RAG: local-first hybrid RAG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="hyb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- left: wordmark -->
  <text x="64" y="132" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#f8fafc">Jev-RAG</text>
  <text x="66" y="172" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#94a3b8">local-first hybrid RAG</text>
  <text x="66" y="202" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#64748b">two pipelines · one interface · fully benchmarked</text>

  <!-- legend -->
  <circle cx="76" cy="252" r="7" fill="#38bdf8"/>
  <text x="92" y="258" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1">Traditional</text>
  <circle cx="206" cy="252" r="7" fill="url(#hyb)"/>
  <text x="222" y="258" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#cbd5e1">Hybrid · Jev-style</text>

  <!-- right: pipeline motif -->
  <!-- shared ingestion column -->
  <rect x="640" y="120" width="120" height="80" rx="10" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="153" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#e2e8f0">your docs</text>
  <text x="700" y="174" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#64748b">embed · ChromaDB</text>

  <!-- fork lines -->
  <path d="M760 160 C 790 160, 790 84, 820 84" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M760 160 C 790 160, 790 236, 820 236" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- traditional lane -->
  <rect x="822" y="56" width="150" height="56" rx="9" fill="#0c1626" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="897" y="80" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#7dd3fc">top-4 → cloud LLM</text>
  <text x="897" y="98" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#64748b">qwen3.7-plus</text>
  <line x1="972" y1="84" x2="1010" y2="84" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="1012" y="56" width="118" height="56" rx="9" fill="#38bdf8"/>
  <text x="1071" y="88" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#082032">cited answer</text>

  <!-- hybrid lane -->
  <rect x="822" y="208" width="150" height="56" rx="9" fill="#0c1626" stroke="#10b981" stroke-width="1.6"/>
  <text x="897" y="232" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#6ee7b7">Jev: rerank · gate</text>
  <text x="897" y="250" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#64748b">route · verify (local)</text>
  <line x1="972" y1="236" x2="1010" y2="236" stroke="#10b981" stroke-width="2.5"/>
  <rect x="1012" y="208" width="118" height="56" rx="9" fill="url(#hyb)"/>
  <text x="1071" y="232" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#052e21">verified answer</text>
  <text x="1071" y="250" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#064e3b">groundedness badge</text>

  <!-- cloud / local bracket -->
  <text x="1152" y="76" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#475569" transform="rotate(90 1152 76)"></text>
  <rect x="822" y="136" width="308" height="2" fill="none"/>
  <text x="976" y="160" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#475569">everything except the cloud LLM runs locally</text>
</svg>
