version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    groups: { minor-and-patch: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: "/backend"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
